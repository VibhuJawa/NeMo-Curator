# One Common Crawl work unit per Slurm GPU node. The JSONL manifest is immutable;
# every array index selects exactly one line. See benchmarking/mineru-html-snapshot.md.
paths:
  - name: results_path
    host_path: "${MINERU_RESULTS_ROOT}"

default_timeout_s: 7200
max_timeout_s: 14340
cleanup_timeout_s: 60
min_timeout_s: 600
gpu_stats_recorder:
  interval_s: 1.0

entries:
  - name: mineru_cc_work_unit
    script: mineru_html_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --work-unit-manifest=${MINERU_WORK_UNIT_MANIFEST}
      --work-unit-index=${MINERU_WORK_UNIT_INDEX}
      --html-field=${MINERU_HTML_FIELD}
      --html-compression=${MINERU_HTML_COMPRESSION}
      --url-field=${MINERU_URL_FIELD}
      --cache-dir=${MINERU_MODEL_CACHE}
      --server-mode=managed
      --reuse-driver-environment
      --num-replicas=8
      --kv-cache-dtype=fp8
      --speculative-tokens=16
      --structured-outputs=per_request
      --cudagraph-mode=FULL_AND_PIECEWISE
      --server-concurrency=256
      --inference-workers=32
      --simplify-workers=8
      --extract-workers=24
      --executor=ray_data
    timeout_s: 12600
    object_store_size: 34359738368
    ray:
      num_gpus: 8
    requirements:
      - metric: is_success
        exact_value: true
      - metric: verification_passed
        exact_value: true
      - metric: published
        exact_value: true
      - metric: status_ok_rate
        min_value: 0.95
      - metric: nonempty_rate
        min_value: 0.95
      - metric: convert_error_rate
        max_value: 0.02
