# Standalone benchmark config for MinerU-HTML main-content extraction.
#
# Kept separate from nightly-benchmark.yaml on purpose: this points at a personal
# dataset and results directory, so it is for ad-hoc runs, not the nightly train.
#
#   python benchmarking/run.py \
#       --config benchmarking/mineru-html-benchmark.yaml \
#       --entries-exact mineru_html_extraction_smoke
#
# Every entry needs a vLLM server already running -- the pipeline is CPU-only and
# these entries do not manage the server. Start it first:
#
#   vllm serve opendatalab/MinerU-HTML-v1.1-hunyuan0.5B-compact \
#     --port 8040 --served-model-name mineru \
#     --data-parallel-size 8 --max-model-len 32768 --gpu-memory-utilization 0.90 \
#     --kv-cache-dtype fp8 --trust-remote-code --generation-config vllm
#
# --generation-config vllm is load-bearing: the checkpoint ships sampling defaults
# (temperature 0.7, top_k 20, repetition_penalty 1.05) that an OpenAI server applies
# as request defaults, and repetition_penalty in particular wrecks the deliberately
# repetitive answer format (measured: extraction_rate 0.015 vs 0.809).
# --data-parallel-size cannot exceed the GPU count: vLLM maps one replica per
# physical GPU, and 16 on 8 GPUs fails with "DP adjusted local rank N out of bounds".
# --kv-cache-dtype fp8 is a server-side tuning knob and the largest single win
# measured on the engine (1.57x); see tutorials/text/mineru-html-extraction/BENCHMARKS.md.
#
# ray.num_gpus is 0 in every entry: no pipeline stage requests a GPU.

paths:
  - name: "results_path"
    host_path: "/scratch/fsw/portfolios/nemotron/projects/nemotron_n4_pre/users/vjawa/bench-results"
  - name: "datasets_path"
    host_path: "/scratch/fsw/portfolios/nemotron/projects/nemotron_n4_pre/users/vjawa/bench-data"

# Per-GPU utilisation samples land in {session_entry_dir}/gpustats.csv. Note that
# the engines run outside Ray now, so this records the node's GPUs, which is still
# what tells you whether the CPU stages managed to keep the server busy.
gpu_stats_recorder:
  interval_s: 1.0

datasets:
  - name: "cc_main_2025_26_html"
    formats:
      - type: "parquet"
        path: "{datasets_path}/cc_main_2025_26_html_100k"
  # 10k strided sample (every 10th row of the 100k), written as 32 shards.
  # Shard count is deliberate: FilePartitioningStage groups whole files and never
  # splits one, so N shards caps the run at N partitions.
  - name: "cc_main_2025_26_html_10k_baseline"
    formats:
      - type: "parquet"
        path: "{datasets_path}/cc_main_2025_26_html_10k_baseline"

entries:
  # Smoke run: 4 shards x 250 documents = 1000 documents. --limit is per reader
  # partition, and --files-per-partition=1 gives one partition per shard.
  - name: mineru_html_extraction_smoke
    enabled: true
    script: mineru_html_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={dataset:cc_main_2025_26_html,parquet}
      --output-path={session_entry_dir}/scratch/output
      --files-per-partition=1
      --limit=250
      --server-url=http://127.0.0.1:8040
      --served-model-name=mineru
      --executor=xenna
    timeout_s: 3600
    # Keep {session_entry_dir}/scratch after the entry finishes. The default (true)
    # deletes it, taking the extracted documents with it -- fine for a throughput-only
    # nightly entry, useless for eyeballing extraction quality.
    delete_scratch: false
    ray:
      num_gpus: 0

  # Full 10k run against a DP=8 server: 62.3 docs/s end to end at extraction 0.809,
  # mean 2812 chars. 32 shards -> 32 partitions. inference_workers is set explicitly
  # because ray_data's actor pool autoscales from 1, which under-feeds the server for
  # the first part of a short run; server queue depth is
  # --server-concurrency x --inference-workers = 768 here.
  - name: mineru_server_mode
    enabled: true
    script: mineru_html_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={dataset:cc_main_2025_26_html_10k_baseline,parquet}
      --output-path={session_entry_dir}/scratch/output
      --files-per-partition=1
      --server-url=http://127.0.0.1:8040
      --served-model-name=mineru
      --server-concurrency=48
      --inference-workers=16
      --simplify-workers=32
      --extract-workers=32
      --executor=ray_data
    timeout_s: 3600
    delete_scratch: false
    # Cap the Ray Plasma object store at 32 GiB. It defaults to ~0.9x node memory
    # (~845 GB), which sits at the /dev/shm ceiling, so any leftover byte there (e.g.
    # a stale loky semaphore from a prior entry) makes cluster startup fail. This
    # workload moves ~0.3 GB between stages, so 32 GiB is ample.
    object_store_size: 34359738368
    ray:
      num_gpus: 0
