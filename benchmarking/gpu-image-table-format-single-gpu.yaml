# Single-H100 NVMe development benchmark. CUDA/cuDF/nvJPEG initialize once in
# one persistent GPU actor; two warmup tasks are excluded from measured trials.
paths:
  - name: results_path
    host_path: /tmp/nemo-curator-gpu-image-table-format-results
  - name: nvme_path
    host_path: /local

gpu_stats_recorder:
  interval_s: 0.25

delete_scratch: false
default_timeout_s: 7200
max_timeout_s: 7200
object_store_size: 34359738368

ray:
  num_cpus: 8
  num_gpus: 1
  enable_object_spilling: false

entries:
  - name: gpu_image_table_formats_single_gpu
    enabled: true
    script: gpu_image_table_format_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --source-lance-uri=s3://mm-nemo-curator/lance_dbs/mint_1t_html_images/47f4e65f452f20ffca8b205a/stable_row_ids/dataset
      --source-version=4
      --working-root={nvme_path}/${USER}/curator-gpu-image-table-format-v2
      --output-root={session_entry_dir}/scratch/outputs
      --storage-label=nvme
      --sample-fractions=0.10,0.20,0.40,0.80,1.00
      --sample-seed=mint-image-format-single-fragment-v1
      --batch-rows=256
      --parquet-row-group-rows=1024
      --resize=64
      --blur-threshold=0.10
      --trials=3
      --reuse-prepared
      --dm-storage-location=pdx-multimodal
      --s3-endpoint=https://pdx.s8k.io
      --s3-region=us-east-1
    timeout_s: 7200
    requirements:
      - metric: output_parity_valid
        exact_value: true
    ray:
      num_cpus: 8
      num_gpus: 1
      enable_object_spilling: false
    object_store_size: 34359738368
